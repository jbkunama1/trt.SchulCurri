{% extends "base.html" %}
{% block content %}
<div class="hero small">
  <div class="hero-emoji">📥📄</div>
  <h1>Dokumente</h1>
  <p class="lead">Curriculum und Vorlagen zum Herunterladen</p>
</div>
<div class="grid">
  {% for d in docs %}
  <div class="card doc-card">
    <div class="doc-icon">{{ d.icon }}</div>
    <h3>{{ d.rel }}</h3>
    <p class="muted">{{ d.size_kb }} KB</p>
    <a class="btn btn-primary" href="{{ url_for('serve_doc', rel=d.rel) }}">⬇️ Herunterladen</a>
  </div>
  {% else %}
  <div class="card"><p class="muted">Keine Dokumente vorhanden.</p></div>
  {% endfor %}
</div>
{% endblock %}
