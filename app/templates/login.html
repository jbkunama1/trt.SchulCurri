{% extends "base.html" %}
{% block content %}
<div class="hero">
  <div class="hero-emoji">🏅🏸⚽🏀🤸🏊</div>
  <h1>Schulcurriculum Sport</h1>
  <p class="lead">Realschule BW · Bildungsplan 2016</p>
</div>
<form method="post" class="card login-card">
  {{ csrf_field() }}
  <h2>🔑 Anmelden</h2>
  {% if err %}<div class="error">{{ err }}</div>{% endif %}
  <label>👤 Benutzername
    <input type="text" name="username" required autocomplete="username" autocapitalize="none">
  </label>
  <label>🔒 Passwort
    <input type="password" name="password" required autocomplete="current-password">
  </label>
  <button class="btn btn-primary" type="submit">Los geht's 🚀</button>
</form>
{% endblock %}
